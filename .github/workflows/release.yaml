# Publishes a release when a GitHub release is published for a v1.19-v1.29 tag.
# Publishing runs only after approval in environment "release".
# Repository variables: GLOO_RELEASE_WIF_PROVIDER (workload identity provider),
# GLOO_RELEASE_SA (service account email in solo-public).
name: Release
run-name: "Release ${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

permissions: {}

# One release at a time per release line. The workflow runs from the tagged commit, which validate
# requires to be on v1.19.x, so the line is this branch: change the group when cutting a new line.
# queue: max keeps a release waiting behind one held for approval instead of replacing it.
concurrency:
  group: release-gloo-v1.19.x
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag and branch
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          set -euo pipefail
          # Prevent self-review blocks only the publisher, so the publisher must be a person, not an App.
          if [[ "${SENDER_TYPE}" != "User" ]]; then
            echo "::error::Release ${TAG} was published by a ${SENDER_TYPE}; a person must publish releases."
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v1\.(19|2[0-9])\.[0-9]+(-[a-z]+)*(-[a-z]+[0-9]*)?$ ]]; then
            echo "::error::Tag ${TAG} does not match v1.<minor>.<patch>[-suffix] for a supported release line"
            exit 1
          fi
          minor="${BASH_REMATCH[1]}"
          branch="v1.${minor}.x"
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${sha}" "origin/${branch}"; then
            echo "::error::Tag ${TAG} (${sha}) is not on origin/${branch}"
            exit 1
          fi
          # Regular release only for no suffix or -patchN; every other suffix is a pre-release.
          if [[ "${TAG}" =~ ^v[0-9.]+(-patch\.?[0-9]+)?$ ]]; then
            build_type=release
          else
            build_type=pre-release
          fi
          {
            echo "tag=${TAG}"
            echo "sha=${sha}"
            echo "version=${TAG#v}"
            echo "build_type=${build_type}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check pre-release flag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          BUILD_TYPE: ${{ steps.check.outputs.build_type }}
        run: |
          set -euo pipefail
          is_pre="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${BUILD_TYPE}" == "pre-release" && "${is_pre}" != "true" ]]; then
            echo "::error::Release ${TAG} must be marked pre-release. Only no suffix or -patchN is a regular release. Edit the release and use Re-run failed jobs."
            exit 1
          fi
          if [[ "${BUILD_TYPE}" == "release" && "${is_pre}" != "false" ]]; then
            echo "::error::Release ${TAG} must not be marked pre-release. Only no suffix or -patchN is a regular release. Edit the release and use Re-run failed jobs."
            exit 1
          fi

  build:
    name: Build and publish images and chart
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA: ${{ needs.validate.outputs.sha }}
      GLOO_RELEASE_SA: ${{ vars.GLOO_RELEASE_SA }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOO_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GLOO_RELEASE_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Submit and wait for Cloud Build
        run: |
          set -euo pipefail
          # A re-run attaches to the tag's existing publish build rather than
          # publishing twice.
          # The API lists newest first. tags and createTime are filtered server-side; the rest client-side.
          existing="$(gcloud builds list \
            --project solo-public \
            --filter="tags=\"gloo\" AND substitutions.TAG_NAME~\"^${TAG//./\\.}\$\" AND substitutions.COMMIT_SHA=\"${SHA}\" AND serviceAccount=\"projects/solo-public/serviceAccounts/${GLOO_RELEASE_SA}\" AND createTime>-P30D" \
            --limit=1 \
            --format='value(id,status)')"
          build_id=""
          if [[ -n "${existing}" ]]; then
            read -r existing_id existing_status <<< "${existing}"
            case "${existing_status}" in
              QUEUED|PENDING|WORKING)
                echo "Attaching to existing publish build ${existing_id} (${existing_status})"
                build_id="${existing_id}"
                ;;
              SUCCESS)
                echo "Tag ${TAG} already published by Cloud Build ${existing_id}"
                exit 0
                ;;
            esac
          fi
          if [[ -z "${build_id}" ]]; then
            # A user-specified service account needs a logging option.
            yq '.options.logging = "CLOUD_LOGGING_ONLY"' ci/cloudbuild/publish-artifacts.yaml > "${RUNNER_TEMP}/publish-artifacts.yaml"
            build_id="$(gcloud builds submit \
              --project solo-public \
              --no-source \
              --config "${RUNNER_TEMP}/publish-artifacts.yaml" \
              --service-account "projects/solo-public/serviceAccounts/${GLOO_RELEASE_SA}" \
              --substitutions "COMMIT_SHA=${SHA},REPO_NAME=gloo,TAG_NAME=${TAG},_PR_NUM=" \
              --async \
              --format='value(id)')"
          fi
          echo "Cloud Build ${build_id}"
          ci/cloudbuild/wait-for-build.sh "${build_id}"

  glooctl:
    name: Upload glooctl release assets
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build and upload glooctl
        env:
          TAGGED_VERSION: ${{ needs.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make publish-glooctl

  register:
    name: Register release in solo-ci
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_TYPE: ${{ needs.validate.outputs.build_type }}
    steps:
      # gloo is public and solo-tools internal, so GitHub won't load solo-tools actions remotely:
      # check solo-tools out with a read-only App token and run the action from the checkout.
      - name: Create solo-tools read token
        id: solo-tools-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PRIVATE_MODULES_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_MODULES_APP_PRIVATE_KEY }}
          owner: solo-io
          repositories: solo-tools
          permission-contents: read

      - name: Check out solo-tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: solo-io/solo-tools
          ref: bb2f009552c04e7c3f8cdcdc49e46409ba80bea8 # release-v0.2.0
          token: ${{ steps.solo-tools-token.outputs.token }}
          path: solo-tools
          persist-credentials: false

      - uses: ./solo-tools/.github/actions/setup-security-scan-artifacts
        with:
          gcp_creds: ${{ secrets.GLOO_VULN_REPORTER }}

      - name: Generate and publish artifacts.yaml
        run: |
          set -euo pipefail
          # The Makefile builds certgen and kubectl for amd64 and arm64, the rest for amd64 only.
          refs() {
            local suffix="$1" img out=()
            shift
            for img in "$@"; do out+=("quay.io/solo-io/${img}:${VERSION}${suffix}"); done
            (IFS=,; echo "${out[*]}")
          }
          amd64=(gloo discovery gloo-envoy-wrapper sds ingress access-logger)
          multiarch=(certgen kubectl)
          ci artifacts generate images -p gloo -v "${TAG}" --category core --ref "$(refs '' "${amd64[@]}")"
          ci artifacts generate images -p gloo -v "${TAG}" --category core --multiarch --ref "$(refs '' "${multiarch[@]}")"
          ci artifacts generate images -p gloo -v "${TAG}" --category core --variants distroless --ref "$(refs -distroless "${amd64[@]}")"
          ci artifacts generate images -p gloo -v "${TAG}" --category core --multiarch --variants distroless --ref "$(refs -distroless "${multiarch[@]}")"
          ci artifacts publish -p gloo -v "${TAG}" --build-type "${BUILD_TYPE}"
