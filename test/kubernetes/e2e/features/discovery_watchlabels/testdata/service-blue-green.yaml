apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
      version: blue
  template:
    metadata:
      labels:
        app: echo
        version: blue
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--name=BLUE"]
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
      version: green
  template:
    metadata:
      labels:
        app: echo
        version: green
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--name=GREEN"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  labels:
    watchedKey: watchedValue
  name: echo-svc
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 80
  selector:
    app: echo
    version: blue
