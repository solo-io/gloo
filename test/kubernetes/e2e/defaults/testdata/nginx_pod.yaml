---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http-web-svc
      name: http
    - protocol: TCP
      port: 8443
      targetPort: https-web-svc
      name: https
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      server {
          listen              80;
          listen              443 ssl;
          server_name         localhost nginx nginx.nginx nginx.nginx.svc nginx.nginx.svc.cluster.local;
          ssl_certificate     /etc/nginx/tls/tls.crt;
          ssl_certificate_key /etc/nginx/tls/tls.key;

          location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
      }
    }
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: nginx-tls
  namespace: nginx
data:
  # Self-signed cert used both as nginx's server cert (tls.crt/tls.key) and as the
  # trust root Envoy verifies it against (ca.crt), so ca.crt is a copy of tls.crt.
  # Valid Aug 1 2026 - Aug 1 2048. Give any replacement a similarly long lifetime:
  # a short-lived cert silently breaks the client_tls suite on expiry, not on merge.
  # To regenerate (the SANs must keep matching server_name in nginx.conf above, and
  # must not match the verifySubjectAltName in the client_tls nginx-oneway-bad-san
  # Upstream, which asserts that SAN verification actually rejects a mismatch):
  #
  #   openssl req -x509 -nodes -newkey rsa:2048 -keyout tls.key -out tls.crt \
  #     -days 8000 -subj "/CN=localhost" \
  #     -addext "subjectAltName=DNS:localhost,DNS:nginx,DNS:nginx.nginx,DNS:nginx.nginx.svc,DNS:nginx.nginx.svc.cluster.local"
  #
  # then base64 tls.crt into both tls.crt and ca.crt, and base64 tls.key into tls.key.
  tls.crt: 
  tls.key: 
  ca.crt: 
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
          name: http-web-svc
        - containerPort: 443
          name: https-web-svc
      resources:
        requests:
          cpu: "100m"
        limits:
          cpu: "200m"
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-tls
          mountPath: /etc/nginx/tls/
          readOnly: true
  volumes:
    - name: nginx-conf
      configMap:
        name: nginx-conf
    - name: nginx-tls
      secret:
        secretName: nginx-tls
