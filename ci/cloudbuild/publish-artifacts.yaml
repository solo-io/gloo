steps:

- name: 'gcr.io/$PROJECT_ID/prepare-go-workspace:0.13.3'
  id: 'prepare-workspace'
  args:
  - '--repo-name'
  - '$REPO_NAME'
  - '--repo-sha'
  - '$COMMIT_SHA'
  - '--repo-output-dir'
  - '.'
  env:
  - 'GIT_SSH_CONFIG=FALSE'

- name: 'gcr.io/cloud-builders/gsutil'
  id: 'untar-mod-cache'
  dir: &dir /workspace/gloo
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    mkdir -p /go/pkg
    cd /go/pkg
    gsutil cat gs://$PROJECT_ID-cache/gloo/gloo-mod.tar.gz | tar -xzf - || echo "untar mod cache failed; continuing because we can download deps as we need them"

- name: 'gcr.io/cloud-builders/docker'
  id: 'docker-login'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker login quay.io --username "solo-io+solobot" --password $$QUAY_IO_PASSWORD
  secretEnv:
  - 'QUAY_IO_PASSWORD'
  waitFor:
  - 'prepare-workspace'

- name: 'gcr.io/cloud-builders/gcloud'
  id: 'prepare-gcr-zone'
  args:
  - 'config'
  - 'set'
  - 'compute/zone'
  - 'us-central1-a'

# Initialize Docker Buildx for multiarch builds
- name: 'gcr.io/cloud-builders/docker'
  id: 'init-buildx'
  args:
  - buildx
  - create
  - --use

# Reset QEMU to avoid segfaults for multiarch images
- name: 'gcr.io/cloud-builders/docker'
  id: 'reset-qemu'
  entrypoint: 'sh'
  args:
    - '-c'
    - 'docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes'

- name: 'gcr.io/$PROJECT_ID/go-mod-make:0.13.3'
  id: 'build-certgen-arm64-binary'
  args:
  - 'certgen-docker'
  dir: *dir
  env:
  - 'GOARCH=arm64'

# Run make targets to push docker images to quay.io
- name: 'gcr.io/$PROJECT_ID/go-mod-make:0.13.3'
  id: 'publish-docker'
  args:
  - 'publish-docker'
  dir: *dir
  env:
  - 'MULTIARCH=true'
  - 'MULTIARCH_PUSH=true'
  - 'DOCKER_API_VERSION=1.41'
  waitFor:
  - 'docker-login'
  - 'init-buildx'
  - 'build-certgen-arm64-binary'

# Publish helm chart, compile manifests, produce release artifacts, deploy docs
# isolating this portion of the release in order to force the manifest to be regenerated with the tagged version
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'gcr-auth'
  dir: *dir
  args:
  - 'auth'
  - 'configure-docker'
  waitFor:
  - 'publish-docker'

- name: 'gcr.io/$PROJECT_ID/go-mod-make:0.13.3'
  id: 'release-chart'
  dir: *dir
  args:
  - 'publish-helm-chart'
  env:
  - 'HELM_REPOSITORY_CACHE=/builder/home/.cache/helm/registry'
  - 'GCLOUD_PROJECT_ID=$PROJECT_ID'
  waitFor:
  - 'gcr-auth'

# Run make targets to build and push docker images to GCR
- name: 'gcr.io/$PROJECT_ID/go-mod-make:0.13.3'
  id: 'publish-docker-extended-gcr'
  dir: *dir
  args:
  - publish-docker
  env:
  - 'MULTIARCH=true'
  - 'MULTIARCH_PUSH=true'
  - 'IMAGE_REGISTRY=gcr.io/gloo-edge'
  - 'DOCKER_API_VERSION=1.41'
  waitFor:
  - 'gcr-auth'
  - 'prepare-gcr-zone'
  - 'publish-docker'

availableSecrets:
  secretManager:
  - versionName: projects/solo-public/secrets/gloo-quay-io-password/versions/latest
    env: QUAY_IO_PASSWORD

timeout: '3600s'
queueTtl: '3600s'

tags:
- 'gloo'

options:
  machineType: 'N1_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY
  env:
  - 'DOCKER_CONFIG=/workspace/docker-config'
  - 'TAGGED_VERSION=$TAG_NAME'
  - 'GOTOOLCHAIN=auto'
  - 'TEST_ASSET_ID=$_PR_NUM'
  volumes:
  - name: 'gopath'
    path: '/go'