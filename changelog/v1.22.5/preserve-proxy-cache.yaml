changelog:
  - type: FIX
    issueLink: https://github.com/solo-io/solo-projects/issues/9126
    resolvesIssue: false
    description: >-
      Replay the latest complete Gateway API Proxy snapshot after control-plane
      setup re-runs caused by Settings or watched namespace changes. Wait for
      successful reconciliation before starting the legacy API loop, preventing
      rate-limit publication from observing an uninitialized Proxy store even
      when Gateway API inputs have not changed. Retry failed reconciliation
      without requiring another input change, and replay intentional empty
      snapshots so deletions take effect.
