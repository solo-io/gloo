changelog:
  - type: NON_USER_FACING
    resolvesIssue: false
    description: >-
      push-docs no longer uses the DOCS_TOKEN personal access token. It reads solo-io/docs with
      the solo-docs-read GitHub App, reads solo-projects releases with the solo-gloo-read App,
      and opens its docs pull requests with a solo-docs-release-pr App token that is minted
      immediately before the push step, so no write credential exists while the docs are
      generated and the docs checkouts keep none. The enterprise copy can also be started by
      workflow_dispatch with glooe_lts and glooe_tag.
