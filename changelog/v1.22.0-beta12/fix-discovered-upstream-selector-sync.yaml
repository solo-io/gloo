changelog:
  - type: FIX
    issueLink: https://github.com/solo-io/solo-projects/issues/9078
    resolvesIssue: false
    description: >-
      Keep a discovered Upstream's kube.selector in sync with its Kubernetes Service. It was
      previously set once at discovery and preserved on every resync, so changing a Service's
      spec.selector left EDS filtering endpoints against stale pod labels, which could leave
      the Upstream with no endpoints and break blue/green deployments. Discovery now owns this
      field, so manual edits to it are replaced; customize it with the
      gloo.solo.io/upstream_config annotation (plus .deep_merge: "true") or your own Upstream.
