changelog:
  - type: NON_USER_FACING
    resolvesIssue: false
    description: >-
      Fix two flaky kube e2e tests. Run the ValidationSplitWebhook suite last, since it
      cannot undo its changes to the ValidatingWebhookConfiguration (a helm hook resource
      that `helm rollback` does not restore) and its matchConditions would otherwise
      disable secret deletion validation for later suites. Retry the client_tls
      VirtualService applies, which can be transiently rejected with a domain conflict
      against a VirtualService that a prior test already deleted.
  - type: NON_USER_FACING
    resolvesIssue: false
    description: >-
      Fix a flake in the ValidationSplitWebhook e2e suite. After scaling gloo back up, AfterTest
      deleted the test's leftover resource as soon as the gloo pod was Ready. Readiness only
      checks the xDS port, so the validation webhook could still be down, and a webhook with
      failurePolicy: Fail refused the delete with "connection refused". AfterTest now retries
      the delete until the webhook answers.
  - type: NON_USER_FACING
    resolvesIssue: false
    description: >-
      Fix a goroutine leak in Consul EDS when `consulDiscovery.edsBlockingQueries` is
      true. Each watched data center and service runs a goroutine that sends query
      results and errors on unbuffered channels. When the watch was cancelled (the
      service left the Consul catalog, or the EDS watch restarted) while that
      goroutine was sending, the reader had already stopped, so the goroutine blocked
      forever and kept the endpoint list it was sending. The sends now also return
      when the watch is cancelled.
